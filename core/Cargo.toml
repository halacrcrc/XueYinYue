[package]
name = "xueyinyue-core"
version = "0.1.0"
edition = "2021"
description = "学音乐 — 乐理计算与学习分析核心引擎（Rust → WebAssembly）"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
rand = "0.8"
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true
